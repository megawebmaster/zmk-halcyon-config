# The rainbow-while-charging behaviour is implemented in src/rgb_vbus_sync.c.
# ZMK's built-in USB auto-off is disabled here because its state machine cannot
# turn the underglow back on after the first unplug, which would fight ours.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# 30 of a 50% maximum, i.e. 15% of full output.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
